name: Link Check

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/check_links.py
      - .github/workflows/link-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check image URLs in README
        run: python scripts/check_links.py
