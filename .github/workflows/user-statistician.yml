name: Generate user stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-push
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate the stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: assets/userstats.svg
          colors: "#1a1b27 #24283b #c792ea #c3cefa #c3cefa"
          featured-repository: swara
          hide-keys: joined, mostStarred, mostForked, private
          max-languages: 8
          animated-language-chart: true
          language-animation-speed: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
