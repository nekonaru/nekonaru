name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check METRICS_TOKEN
        id: guard
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "METRICS_TOKEN secret is not set, skipping metrics generation."
            echo "Create a personal access token at https://github.com/settings/tokens (no scopes needed for public data, add read:user to include private contributions), then save it as the METRICS_TOKEN repository secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate metrics
        if: steps.guard.outputs.skip != 'true'
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_limit: 6
          plugin_languages_details: percentage
